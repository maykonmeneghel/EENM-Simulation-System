[project]
name = "eenm-engine"
version = "0.1.0"
description = "Neuromuscular electrical stimulation simulator engine (port of the EENM MATLAB model)"
readme = "README.md"
authors = [
    { name = "maykonmeneghel", email = "maykonmeneghel@icloud.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "numpy>=2.5.4",
    "pydantic>=2.14.2",
    "scipy>=1.18.1",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.10.9,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    # Starlette's TestClient warns about httpx; httpx is the documented FastAPI test dependency.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "N", "RUF"]
# Scientific notation (×, –, λ) in docstrings is intentional.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
packages = ["eenm_engine"]

[[tool.mypy.overrides]]
module = ["scipy.*"]
ignore_missing_imports = true
