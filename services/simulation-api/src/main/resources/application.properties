spring.application.name=simulation-api
server.port=${PORT:8080}

engine.base-url=${ENGINE_BASE_URL:http://localhost:8001}
engine.connect-timeout=${ENGINE_CONNECT_TIMEOUT:2s}
engine.max-line-size=${ENGINE_MAX_LINE_SIZE:16MB}
engine.preset-cache-ttl=${ENGINE_PRESET_CACHE_TTL:10m}
# sent as X-Engine-Key on every engine call when set (docs/deployment.md)
engine.secret=${EENM_ENGINE_SECRET:}

api.cors.allowed-origins=${API_CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Hosted-deployment guards (docs/deployment.md). Every default keeps the local behaviour.
eenm.limits.max-duration-ms=${EENM_MAX_DURATION_MS:300000}
eenm.limits.min-step-ms=${EENM_MIN_STEP_MS:0.005}
eenm.limits.max-frequency-hz=${EENM_MAX_FREQUENCY_HZ:200}
eenm.limits.max-units-per-type=${EENM_MAX_UNITS_PER_TYPE:200}
eenm.limits.max-total-units=${EENM_MAX_TOTAL_UNITS:600}
eenm.limits.max-output-points=${EENM_MAX_OUTPUT_POINTS:0}
eenm.limits.max-unit-events-duration-ms=${EENM_MAX_UNIT_EVENTS_DURATION_MS:30000}
# empty = no login; else Firebase ID tokens of this project are required to run simulations
eenm.auth.firebase-project-id=${EENM_AUTH_FIREBASE_PROJECT_ID:}
# with sign-in on: only these e-mails (comma separated, verified) may run simulations; empty = any verified account
eenm.auth.allowed-emails=${EENM_AUTH_ALLOWED_EMAILS:}
eenm.auth.jwk-set-uri=${EENM_AUTH_JWK_SET_URI:https://www.googleapis.com/service_accounts/v1/jwk/securetoken@system.gserviceaccount.com}
# empty = no check; else every request but the health check needs X-Origin-Verify: <secret>
eenm.origin-secret=${EENM_ORIGIN_SECRET:}

management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
