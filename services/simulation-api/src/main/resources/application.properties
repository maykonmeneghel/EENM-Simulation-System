spring.application.name=simulation-api
server.port=${PORT:8080}

engine.base-url=${ENGINE_BASE_URL:http://localhost:8001}
engine.connect-timeout=${ENGINE_CONNECT_TIMEOUT:2s}
engine.max-line-size=${ENGINE_MAX_LINE_SIZE:16MB}
engine.preset-cache-ttl=${ENGINE_PRESET_CACHE_TTL:10m}

api.cors.allowed-origins=${API_CORS_ALLOWED_ORIGINS:http://localhost:5173}

management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
